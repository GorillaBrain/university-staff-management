rules:
  - id: usms-unsafe-raw-query
    languages: [typescript, javascript]
    severity: ERROR
    message: Raw SQL text reaches an unsafe Prisma query. Confirm whether request input is concatenated; use parameterised Prisma queries.
    metadata:
      category: security
      cwe: ["CWE-89: SQL Injection"]
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)
  - id: usms-hardcoded-development-secret
    languages: [typescript, javascript]
    severity: WARNING
    message: A development authentication secret is hardcoded. It must stay confined to the local audit build; use independently managed secrets for deployment.
    patterns:
      - pattern: export const $NAME = $VALUE;
      - metavariable-regex:
          metavariable: $NAME
          regex: '.*(SECRET|TOKEN|PASSWORD)$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '["\x27].{16,}["\x27]'
  - id: usms-staff-profile-authorization-review
    languages: [typescript]
    severity: WARNING
    message: This staff detail GET handler reads a record and returns it without the application canView ownership/role guard. Manually verify authorization.
    patterns:
      - pattern: |
          export async function GET(...) {
            return endpoint(async () => {
              ...
              const $TARGET = await db.staff.findUnique(...);
              ...
              return json(...);
            });
          }
      - pattern-not-regex: '\bcanView\s*\('
