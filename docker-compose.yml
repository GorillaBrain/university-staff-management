services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: usms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: usms_secure
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - secure-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usms -d usms_secure"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  secure-postgres:
